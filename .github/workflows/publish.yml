name: Publish Docker images

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare image names
        id: vars
        run: |
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/backend:latest
            ${{ steps.vars.outputs.image_prefix }}/backend:${{ github.sha }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image_prefix }}/backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/frontend:latest
            ${{ steps.vars.outputs.image_prefix }}/frontend:${{ github.sha }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image_prefix }}/frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Update Kubernetes image versions
        run: |
          sed -i -E "s|(image: ghcr.io/houusamge19/ci-cd-showcase/backend:).*|\1${GITHUB_SHA}|" kubernetes/app.yaml
          sed -i -E "s|(image: ghcr.io/houusamge19/ci-cd-showcase/frontend:).*|\1${GITHUB_SHA}|" kubernetes/app.yaml

      - name: Commit deployment version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/app.yaml

          git commit -m "deploy: ${GITHUB_SHA}" || exit 0
          git push