apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-showcase
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/HouusamGE19/CI-CD-Showcase.git
    targetRevision: master
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
